# .cargo/config.toml — CHRONOS workspace cargo configuration

[alias]
# STEP 22: Cargo audit alias so `cargo security` runs the full suite.
security    = "audit --deny warnings"
lint        = "clippy --workspace --all-targets -- -D warnings -W clippy::pedantic -W clippy::nursery"
check-all   = "check --workspace --all-targets"

[build]
# STEP 23: Static CRT linking for musl targets (avoids host libc dependency).
# Activate with: cargo build --target x86_64-unknown-linux-musl
# rustflags is set per-target below to avoid breaking Windows builds.

[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static", "-C", "link-arg=-static"]

[target.x86_64-pc-windows-gnu]
# GNU toolchain required for gmp-mpfr-sys on Windows.
linker = "x86_64-w64-mingw32-gcc"
