[package]
name = "chronos-snark"
version = "0.1.0"
edition = "2021"

[dependencies]
chronos-core          = { path = "../chronos-core" }
ark-ff                = { workspace = true }
ark-relations         = { workspace = true }
ark-groth16           = { workspace = true }
ark-bn254             = { workspace = true }
ark-ec                = { workspace = true }
ark-r1cs-std          = { workspace = true }
ark-crypto-primitives = { workspace = true }
ark-std               = { workspace = true }
ark-serialize         = { workspace = true }
num-bigint            = { workspace = true }
thiserror             = { workspace = true }
rand                  = { workspace = true }
sha2                  = { workspace = true }
serde                 = { workspace = true }
serde_json            = { workspace = true }
serde_bytes           = "0.11"
hex                   = "0.4"

[dev-dependencies]
# The lifecycle integration test performs real sequential squarings, because the
# claim under test is that the agent recovers the key only by doing that work.
chronos-vdf = { path = "../chronos-vdf" }
