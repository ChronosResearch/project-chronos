# Default configuration for the CHRONOS agent.
# All values here may be overridden by placing a config.toml in the working
# directory, or via the CHRONOS__ environment variable prefix
# (e.g. CHRONOS__NETWORK__DRAND_URL overrides network.drand_url).

[mission]
# Total mission duration in seconds.  The watchdog forces Erased state after
# this many seconds if the VDF has not completed naturally.
t_seconds = 3600

# STEP 19 – In debug builds the actual T used for VDF is min(t_vdf_steps, 10).
# In release builds the full value is used.
t_vdf_steps = 1_000_000

[crypto]
# RSA modulus size for the MPC-generated group order.
rsa_bits = 2048

# Path to the MPC-generated RSA modulus (big-endian binary).
cert_n_path = "certN.bin"

# Path to the encrypted secret key ciphertext.
ct_sk_path = "ct_sk.bin"

[network]
# Drand HTTP API endpoint.
drand_url = "https://api.drand.sh/public/latest"
# Timeout for the drand HTTP request in seconds.
drand_timeout_secs = 10

[server]
# Main API listen address.
api_addr = "127.0.0.1:8080"
# Prometheus metrics listen address.
metrics_addr = "127.0.0.1:9090"
