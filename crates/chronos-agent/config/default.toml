# Default configuration for the CHRONOS agent.
# All values may be overridden via config.toml or CHRONOS__ env vars.

[mission]
t_seconds    = 3600
t_vdf_steps  = 1_000_000

[crypto]
rsa_bits     = 2048
cert_n_path  = "certN.bin"
ct_sk_path   = "ct_sk.bin"

[network]
drand_url           = "https://api.drand.sh/52db9ba70e0cc0f6eaf7803dd07447a1f5477735fd3f661792ba94600c84e971/public/latest"
drand_timeout_secs  = 10

[server]
api_addr     = "127.0.0.1:8080"
metrics_addr = "127.0.0.1:9090"

[tls]
enabled          = false
# ca_cert_path   = "ca.pem"
# agent_cert_path = "agent.pem"
# agent_key_path  = "agent.key"

# VDF backend: "wesolowski" (classical) or "isogeny" (post-quantum simulation)
vdf_backend = "wesolowski"
