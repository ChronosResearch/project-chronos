[package]
name = "chronos-agent"
version = "0.1.0"
edition = "2021"

[dependencies]
# Internal crates
chronos-core  = { path = "../chronos-core" }
chronos-vdf   = { path = "../chronos-vdf" }
chronos-snark = { path = "../chronos-snark" }

# Async runtime & HTTP
tokio   = { workspace = true }
axum    = { workspace = true }
reqwest = { workspace = true }

# Logging
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow    = { workspace = true }

# CLI
clap = { workspace = true }

# Crypto
sha2       = { workspace = true }
hmac       = { workspace = true }
libc       = { workspace = true }
num-bigint = { workspace = true }
zeroize    = { workspace = true }
rand       = { workspace = true }

# BN254 field elements, for the public commitments served by /attestation.
ark-bn254 = { workspace = true }
ark-ff    = { workspace = true }

# BLS12-381 drand signature verification
blst = { workspace = true }
hex  = { workspace = true }

# Post-quantum signatures (NIST ML-DSA / Dilithium3)
pqcrypto-dilithium = { workspace = true }
pqcrypto-traits    = { workspace = true }

# Serialization
serde      = { workspace = true }
serde_json = { workspace = true }

# Config
config = { workspace = true }

# Metrics
prometheus = { workspace = true }
once_cell  = "1.20.3"
