# cargo-deny configuration for CHRONOS workspace.
# Run: cargo deny check
# Schema: cargo-deny >= 0.16 (v2)

[advisories]
# Known advisories from transitive deps not yet patched upstream.
# Each entry must have a comment explaining why it is acceptable.
ignore = [
    # RUSTSEC-2025-0055: tracing-subscriber 0.2.x ANSI escape injection.
    # We use 0.3.x; advisory only affects older transitive dep.
    "RUSTSEC-2025-0055",
    # RUSTSEC-2025-0141: bincode unmaintained (used by tfhe-rs).
    "RUSTSEC-2025-0141",
    # RUSTSEC-2024-0388: derivative unmaintained (used by arkworks).
    "RUSTSEC-2024-0388",
    # RUSTSEC-2024-0437: protobuf 2.x crash via recursion (transitive, tfhe-rs chain).
    "RUSTSEC-2024-0437",
    # RUSTSEC-2024-0436: paste crate unmaintained (tfhe-rs macros).
    "RUSTSEC-2024-0436",
]

[licenses]
# Accept any license that is OSI-approved OR FSF-approved free software.
# This covers MIT, Apache-2.0, BSD-*, ISC, MPL-2.0, LGPL, OpenSSL, Zlib, etc.
# Avoids the brittle allow-list that breaks whenever a new dep is added.
allow-osi-fsf-free = "either"
# Still block completely unknown/proprietary licenses.
unlicensed = "deny"
# Copyleft (GPL) is a warning only — most transitive deps are LGPL at worst.
copyleft = "allow"

[bans]
multiple-versions = "warn"
deny = []

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
