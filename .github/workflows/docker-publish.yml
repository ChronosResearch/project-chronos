name: Publish Docker Image

on:
  push:
    branches:
      - main
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/project-chronos-agent

# FAIL-SAFE: Cancel any in-progress run if a new commit arrives on the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    # FAIL-SAFE: Prevent hung Rust/TFHE builds from burning minutes indefinitely
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      # FAIL-SAFE: Required for generating signed image attestations (provenance/SBOM)
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # FAIL-SAFE: Explicit Buildx setup for advanced caching and multi-platform support
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=tag

      - name: Build and push Docker image
        id: build-and-push-image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: chronos-rust/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # FAIL-SAFE: Cache layers between runs to ensure deterministic, fast rebuilds
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # FAIL-SAFE: Generate signed SLSA provenance and SBOM for grant auditors
          provenance: true
          sbom: true

      # FAIL-SAFE: Upload build attestation so evaluators can verify image integrity independently
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build-and-push-image.outputs.digest }}
          push-to-registry: true
