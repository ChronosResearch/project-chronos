name: CI v2.0

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: write

env:
  CARGO_TERM_COLOR: always
  RUST_LOG: "chronos=debug"
  # Cache key busting: bump this if you change toolchain or major deps.
  CACHE_VERSION: "v2"

jobs:

  # ════════════════════════════════════════════════════════════════════════════
  # TIER 1 — HARD GATES  (failures block the PR merge)
  # ════════════════════════════════════════════════════════════════════════════

  repo-hygiene:
    name: "🧹 Repo hygiene"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Guards against unanchored .gitignore patterns silently excluding standard
      # Cargo layouts. `tests/` without a leading slash matches crates/*/tests/ at
      # any depth, so an added integration test would never be committed — and CI
      # would pass, because the file does not exist in the repository.
      - name: Standard Cargo paths must be committable
        run: ./scripts/check_gitignore.sh

  build:
    name: "🔨 Build (debug)"
    runs-on: ubuntu-latest
    # A cold build of the TFHE and arkworks trees on a 2-core runner is slow, and
    # dependencies are now compiled at opt-level 3 even in debug (see
    # `[profile.dev.package."*"]` in Cargo.toml), which trades build time for a
    # test suite that terminates. 45 minutes is headroom, not an expectation.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Cache Rust toolchain + registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ env.CACHE_VERSION }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ env.CACHE_VERSION }}-cargo-

      - name: cargo build (debug, all targets)
        run: cargo build --workspace --all-targets

  test:
    name: "✅ Tests"
    runs-on: ubuntu-latest
    needs: [build]
    # A hang must cost 45 minutes, not 6 hours. Run #60 was cancelled at the
    # 6-hour GitHub ceiling with no result, which is the worst possible outcome:
    # maximum runner cost, zero information.
    #
    # Sizing: with dependencies optimised (see `[profile.dev.package."*"]` in
    # Cargo.toml) chronos-core completes in ~200s on a 12-thread machine, of which
    # the four TFHE key-generating tests are ~190s. GitHub runners have 2-4 cores,
    # so budget 3-4x, and the full workspace adds the Groth16 suites on top. 45
    # minutes therefore means "something is wrong", not "this is slow" — but it is
    # deliberately not tighter, because a false timeout on a legitimately slow FHE
    # test is indistinguishable from a real failure in the gate.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Cache Rust toolchain + registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ env.CACHE_VERSION }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ env.CACHE_VERSION }}-cargo-

      # `--all-targets` excludes doctests, so they are run separately below.
      # Without the second invocation the doc examples in chronos-core and
      # chronos-agent are compiled by `cargo doc` but never executed.
      - name: cargo test workspace
        run: cargo test --workspace --all-targets

      - name: cargo test doctests
        run: cargo test --workspace --doc

  # ── Coverage was removed ────────────────────────────────────────────────────
  #
  # `cargo tarpaulin` re-ran the entire workspace under llvm-cov instrumentation,
  # so it duplicated the `test` job at higher cost. It exceeded its 60-minute
  # timeout on every run, was `continue-on-error` and therefore never gated
  # anything, and the resulting percentage was not used to make any decision.
  #
  # A coverage number is worth having when it changes behaviour — a threshold that
  # blocks a merge, or a report someone reads. Neither applied here, so it was
  # pure runner cost. Reinstate it scoped to `chronos-core` and `chronos-snark`
  # with the FHE tests excluded if it becomes useful.

  # ── Static musl binary ──────────────────────────────────────────────────────
  #
  # Runs on pushes to main, not on pull requests, and is NOT a required check.
  #
  # This is a packaging concern rather than a correctness one: a compilation error
  # would already have been caught by the debug build, and nothing about the
  # protocol depends on the binary being statically linked. Blocking PRs on it
  # meant a 60-minute LTO build sat on the critical path of every review.
  #
  # `lto = true` with `codegen-units = 1` across the TFHE and arkworks trees is
  # slow on a 2-core runner. The 1m 50s observed on earlier runs was a warm cache,
  # not a cold build, which is why the timeout looked generous and was not.
  release-build:
    name: "📦 Release Build + Size Check"
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push'
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Cache Rust toolchain + registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ env.CACHE_VERSION }}-cargo-musl-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ env.CACHE_VERSION }}-cargo-musl-

      # Only the musl build needs anything from apt. `gcc`, `g++` and `cmake`
      # already ship with the ubuntu-latest image, and `libgmp-dev` was never
      # needed at all — `gmp-mpfr-sys` is commented out in Cargo.toml and
      # chronos-vdf uses the pure-Rust num-bigint backend.
      - name: Install musl toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Add musl target
        run: rustup target add x86_64-unknown-linux-musl

      - name: cargo build --release (musl static binary)
        run: cargo build --release --target=x86_64-unknown-linux-musl -p chronos-agent
        env:
          CC: musl-gcc

      - name: Binary size check (< 200 MB)
        run: |
          SIZE=$(du -m target/x86_64-unknown-linux-musl/release/chronos-agent | cut -f1)
          echo "Binary size: ${SIZE} MB"
          if [ "$SIZE" -gt 200 ]; then
            echo "❌ Binary exceeds 200 MB limit (${SIZE} MB)"
            exit 1
          fi
          echo "✅ Binary size OK: ${SIZE} MB"

  # ════════════════════════════════════════════════════════════════════════════
  # TIER 2 — SOFT GATES  (failures annotate the PR but do NOT block merge)
  # These run in parallel and use continue-on-error: true.
  # They produce annotations and are visible in the PR, but won't
  # prevent merging so a single upstream lint rule can't kill the pipeline.
  # ════════════════════════════════════════════════════════════════════════════

  clippy:
    name: "🔍 Clippy (report only)"
    runs-on: ubuntu-latest
    continue-on-error: true          # ← FAILSAFE: annotates but never blocks
    steps:
      - uses: actions/checkout@v4

      - name: cargo clippy (warnings as annotations)
        run: cargo clippy --workspace --all-targets 2>&1 || true

      - name: cargo fmt check
        run: cargo fmt --all -- --check 2>&1 || true

  security:
    name: "🛡️ Security Scan (report only)"
    runs-on: ubuntu-latest
    continue-on-error: true          # ← FAILSAFE: reports CVEs but never blocks
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: cargo deny check
        run: cargo deny check 2>&1 || true

  docs:
    name: "📚 Documentation"
    runs-on: ubuntu-latest
    continue-on-error: true          # ← FAILSAFE: missing docs annotate, don't block
    steps:
      - uses: actions/checkout@v4

      - name: cargo doc
        run: cargo doc --no-deps --workspace 2>&1 || true

  deps:
    name: "🌲 Dependency Audit"
    runs-on: ubuntu-latest
    continue-on-error: true          # ← FAILSAFE: duplicate crates annotate, don't block
    steps:
      - uses: actions/checkout@v4

      - name: Check for duplicate crates
        run: cargo tree --duplicates 2>&1 || true

  miri:
    name: "🧪 Miri (memory safety)"
    runs-on: ubuntu-latest
    continue-on-error: true          # ← FAILSAFE: Miri is informational
    # Miri interprets rather than executes, so it is orders of magnitude slower.
    # The FHE and MLP tests are unreachable under it in any sane time and are
    # skipped in chronos-core; this bound catches anything else that creeps in.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly + Miri
        run: |
          rustup toolchain install nightly
          rustup +nightly component add miri rust-src

      # Miri sandboxes filesystem access by default, so `MpcCertificate::load`
      # aborts on `std::fs::read` with "unsupported operation: `open` not
      # available when isolation is enabled" — not a memory-safety finding.
      # Disabling isolation lets Miri reach the code worth checking here: the
      # `unsafe` blocks in LockedBytes (mlock) and secure_wipe.
      - name: Run Miri on chronos-core
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
        run: cargo +nightly miri test --package chronos-core

  # ════════════════════════════════════════════════════════════════════════════
  # FINAL GATE — only depends on the HARD gates
  # ════════════════════════════════════════════════════════════════════════════

  # Three required checks: the tree is committable, it compiles, and the tests
  # pass. `release-build` is deliberately absent — it is skipped on pull requests,
  # and a skipped job reports neither success nor failure, so requiring it here
  # would fail every PR.
  ci-gate:
    name: "🚦 All required checks passed"
    needs: [repo-hygiene, build, test]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check hard gate results
        run: |
          echo "repo-hygiene: ${{ needs.repo-hygiene.result }}"
          echo "build:        ${{ needs.build.result }}"
          echo "test:         ${{ needs.test.result }}"
          if [ "${{ needs.repo-hygiene.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ]; then
            echo "❌ One or more required checks failed"
            exit 1
          fi
          echo "✅ All required checks passed"
