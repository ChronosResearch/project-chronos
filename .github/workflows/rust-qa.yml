name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: write

env:
  CARGO_TERM_COLOR: always
  RUST_LOG: "chronos=debug"

jobs:
  # ── Clippy ──────────────────────────────────────────────────────────────────
  clippy:
    name: Clippy (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GCC, GMP, CMake
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ cmake libgmp-dev

      - name: Set up Rust (stable)
        run: |
          rustup toolchain install stable
          rustup component add clippy rustfmt

      - name: cargo clippy (warnings-as-errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo fmt check
        run: cargo fmt --all -- --check

  # ── Security scanning ────────────────────────────────────────────────────────
  security:
    name: Security Scan (audit + deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-audit and cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny

      - name: cargo deny check (advisories + licenses + bans)
        run: cargo deny check

  # ── Dependency tree ──────────────────────────────────────────────────────────
  deps:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for duplicate crates
        run: cargo tree --duplicates

  # ── Tests ─────────────────────────────────────────────────────────────────────
  test:
    name: Tests (debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ cmake libgmp-dev

      - name: cargo test workspace
        run: cargo test --workspace --all-targets

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@cargo-tarpaulin

      - name: Coverage report
        run: cargo tarpaulin --engine llvm --workspace --timeout 120 --out xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # ── Release build + size check ───────────────────────────────────────────────
  build-release:
    name: Release Build + Size Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ cmake libgmp-dev musl-tools

      - name: Add musl target
        run: rustup target add x86_64-unknown-linux-musl

      - name: cargo build --release (musl)
        run: cargo build --release --target=x86_64-unknown-linux-musl -p chronos-agent
        env:
          CC: musl-gcc

      - name: Check binary size (must be < 200 MB)
        run: |
          SIZE=$(du -m target/x86_64-unknown-linux-musl/release/chronos-agent | cut -f1)
          echo "Binary size: ${SIZE} MB"
          if [ "$SIZE" -gt 200 ]; then
            echo "ERROR: Binary exceeds 200 MB limit (${SIZE} MB)"
            exit 1
          fi

  # ── Documentation ────────────────────────────────────────────────────────────
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ cmake libgmp-dev

      - name: cargo doc (build only, warn on missing docs)
        run: cargo doc --no-deps --workspace

  # ── Miri (informational, non-blocking) ───────────────────────────────────────
  miri:
    name: Miri (chronos-core)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly + Miri
        run: |
          rustup toolchain install nightly
          rustup +nightly component add miri rust-src

      - name: Run Miri on chronos-core
        run: cargo +nightly miri test --package chronos-core

  # ── Final gate ────────────────────────────────────────────────────────────────
  ci-gate:
    name: "All checks"
    needs: [clippy, security, deps, test, build-release, docs]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All CI steps passed"
