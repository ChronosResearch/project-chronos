[workspace]
resolver = "2"
members = [
    "crates/*"
]

[workspace.dependencies]
# ── TFHE (Official Zama crate, pinned to exact patch) ─────────────────────────
# The `x86_64` feature is NOT optional: it supplies the RDSEED-backed seeder that
# `generate_keys` requires. Without a seeder feature, key generation compiles
# fine and then panics at runtime with
#   "Unable to instantiate a seeder, make sure to enable a seeder feature"
# so the failure only surfaces in tests that actually generate keys. It also
# enables AES-NI acceleration.
#
# On aarch64 this must be swapped for the `aarch64` feature, which provides the
# equivalent seeder for that target. Nothing here currently builds for aarch64;
# if that changes, this needs to become a target-specific dependency in each
# consuming crate, since `[workspace.dependencies]` cannot express `cfg()`.
tfhe = { version = "0.8.7", features = ["integer", "x86_64"] }

# ── Arkworks (SNARKs, pinned) ─────────────────────────────────────────────────
ark-groth16              = "0.4.0"
ark-bn254                = "0.4.0"
ark-ff                   = "0.4.2"
ark-relations            = "0.4.0"
ark-r1cs-std             = "0.4.0"
# `sponge` supplies the Poseidon permutation with Grain-LFSR round constants and a
# Cauchy MDS matrix; `r1cs` supplies the matching `PoseidonSpongeVar` gadget. Both
# are required: CHRONOS proves the same Poseidon relation natively (to build the
# public commitments) and in-circuit (to prove knowledge of the pre-image), and the
# two must be bit-identical or every proof fails. `chronos_snark::poseidon`'s
# `test_native_and_gadget_agree` pins that.
ark-crypto-primitives    = { version = "0.4.0", features = ["crh", "merkle_tree", "commitment", "prf", "sponge", "r1cs"] }
ark-std                  = "0.4.0"
ark-serialize            = "0.4.2"
# Curve/group traits (AffineRepr, CurveGroup) used by the EVM export path.
ark-ec                   = "0.4.0"

# ── GMP (optional, x86_64 only — chronos-vdf uses pure-Rust num-bigint fallback) ──
# gmp-mpfr-sys = "1.7.1"

# ── Async & HTTP API ──────────────────────────────────────────────────────────
tokio   = { version = "1.43.0", features = ["full"] }
axum    = "0.8.4"
reqwest = { version = "0.12.28", features = ["json", "rustls-tls"], default-features = false }

# ── Error handling ────────────────────────────────────────────────────────────
thiserror = "2.0.12"
anyhow    = "1.0.98"

# ── Logging & CLI ─────────────────────────────────────────────────────────────
tracing            = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json"] }
clap               = { version = "4.5.40", features = ["derive"] }

# ── Post-Quantum signatures (NIST ML-DSA / Dilithium3) ──────────────────────
pqcrypto-dilithium = { version = "0.5.0" }
pqcrypto-traits    = "0.3.5"

# ── Crypto utilities ──────────────────────────────────────────────────────────
zeroize    = { version = "1.8.1", features = ["derive"] }
sha2       = "0.10.9"
hkdf       = "0.12.4"
# Request authentication. `Hmac::verify_slice` is a constant-time comparison,
# which is why the agent uses it rather than comparing MAC bytes with `==`.
hmac       = "0.12.1"
libc       = "0.2.189"
hex        = "0.4.3"
num-bigint = { version = "0.4.8", features = ["rand"] }
num-traits = "0.2.19"
serde      = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.140"
# Wire format for FHE ciphertext payloads on /infer.
# NOTE: pinned to 1.x — the 2.x API is incompatible with the
# `serialize`/`deserialize` calls in chronos-core::fhe.
bincode    = "1.3.3"
aes-gcm    = "0.10.3"
blst       = "0.3.13"
rand       = "0.8.5"
rand_core  = "0.6.4"

# ── Config ────────────────────────────────────────────────────────────────────
config = { version = "0.14.1", default-features = false, features = ["toml"] }

# ── Metrics ───────────────────────────────────────────────────────────────────
prometheus = { version = "0.13.4", features = ["process"] }
once_cell  = "1.20.3"

# ── Testing ───────────────────────────────────────────────────────────────────
tokio-test = "0.4.4"

[profile.release]
lto           = true
codegen-units = 1
strip         = "symbols"
opt-level     = 3
panic         = "abort"

[profile.dev]
opt-level = 0
debug     = true

# Dependencies are compiled with full optimisation even in debug and test builds.
#
# This is not a tuning preference; without it the test suite does not terminate in
# usable time. TFHE-rs performs millions of polynomial FFT operations per key
# generation, and at `opt-level = 0` that is 50-100x slower than optimised. The
# observable effect was `fhe::tests::test_evaluate_ciphertext_round_trip` and the
# three `mlp::` tests running for hours, which drove CI run #60 into GitHub's
# 6-hour job ceiling and left #61 hanging in the same place.
#
# `"*"` matches dependencies only, never workspace members, so CHRONOS's own code
# still compiles unoptimised with full debug info and fast incremental rebuilds.
# `[profile.test]` inherits from `[profile.dev]`, so this covers `cargo test` too.
#
# `debug = false` on dependencies is a large additional win: debug info for the
# arkworks and TFHE trees is most of the link time and none of it is useful when
# debugging CHRONOS.
[profile.dev.package."*"]
opt-level = 3
debug     = false

# Coverage instrumentation compounds with the above: tarpaulin re-runs the whole
# suite under llvm-cov, so an unoptimised dependency tree costs the slow path
# twice. Keep this profile aligned with `dev`.
[profile.test.package."*"]
opt-level = 3
debug     = false
